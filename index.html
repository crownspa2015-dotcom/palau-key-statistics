<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palau — Key Statistics</title>
<style>
:root{
  --navy:#07195b;--blue:#0b68d9;--blue2:#54bff1;--ink:#0b1f63;--muted:#60739a;
  --gold:#d88916;--gold2:#f3bd51;--green:#278653;--green2:#72c98f;
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);
background:radial-gradient(circle at 12% 0%,rgba(78,177,242,.13),transparent 28%),linear-gradient(180deg,#fff,#f2f9ff 62%,#eef7fb)}
.wrap{width:100%;padding:14px 14px 28px}
.hero,.pillar{border:1px solid rgba(54,116,187,.15);border-radius:22px;box-shadow:0 10px 28px rgba(20,66,137,.09);overflow:hidden}
.hero{position:relative;padding:26px 30px;margin-bottom:18px;background:linear-gradient(115deg,#fff 0%,#fcfeff 48%,#dff4ff 100%)}
.hero:after{content:"";position:absolute;width:460px;height:460px;border-radius:50%;right:-180px;top:-230px;background:radial-gradient(circle,rgba(50,170,241,.35),transparent 67%)}
.hero h1{margin:0 0 9px;font-size:44px;letter-spacing:-.8px;position:relative;z-index:1}
.hero p{margin:0;max-width:980px;color:#35577f;line-height:1.5;font-size:15px;position:relative;z-index:1}
.pillar{margin:18px 0;background:#fff}
.social{background:linear-gradient(180deg,#f9fcff,#edf7ff)}
.economic{background:linear-gradient(180deg,#fffef9,#fff6df)}
.environment{background:linear-gradient(180deg,#f8fcf9,#eaf7ee)}
.head{display:flex;align-items:center;gap:12px;padding:11px 17px;color:white;min-height:72px}
.social .head{background:linear-gradient(90deg,#0a62d3,#1a99eb 54%,#55c4f5)}
.economic .head{background:linear-gradient(90deg,#b46a08,#df9017 54%,#f4bd50)}
.environment .head{background:linear-gradient(90deg,#227a4a,#329b62 54%,#72c98f)}
.badge{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);font-size:23px}
.head h2{margin:0;font-size:28px}.head small{font-size:12px}.strap{margin-left:auto;text-align:right;font-size:12px;font-weight:700;max-width:44%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;padding:13px}
.card{min-width:0;min-height:152px;display:flex;gap:12px;padding:14px;border-radius:17px;background:linear-gradient(145deg,#fff,#f7fbff);border:1px solid rgba(45,108,181,.13);box-shadow:0 7px 17px rgba(18,69,132,.06)}
.economic .card{background:linear-gradient(145deg,#fffefb,#fff8e9);border-color:rgba(190,125,20,.16)}
.environment .card{background:linear-gradient(145deg,#fff,#f3faf5);border-color:rgba(45,135,79,.14)}
.icon{width:46px;height:46px;flex:0 0 46px;border-radius:15px;display:grid;place-items:center;font-size:20px;background:#e5f2ff;color:#0a65cf}
.economic .icon{background:#ffedc8;color:#b46b0b}.environment .icon{background:#dff3e5;color:#2b8654}
.label{font-size:12.4px;font-weight:800;line-height:1.22;margin-bottom:7px}.value{font-size:clamp(21px,1.7vw,28px);font-weight:900;line-height:1.03;letter-spacing:-.3px;white-space:nowrap}
.period{font-size:11.2px;color:#61769c;line-height:1.32;margin-top:7px}.source{font-size:9.7px;line-height:1.28;color:#3d5d88;margin-top:8px}
a{color:#456fa6;text-decoration:underline;text-underline-offset:2px}
.visual-band{padding:0 13px 14px}
.visual-kicker{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin:3px 2px 9px;color:#527399}
.economic .visual-kicker{color:#a36b11}.environment .visual-kicker{color:#34754f}
.visual-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.visual-grid.single{grid-template-columns:1fr}
.visual{border-radius:18px;padding:16px 18px;background:linear-gradient(145deg,#fff,#f5fbff);border:1px solid rgba(45,108,181,.13);box-shadow:0 8px 19px rgba(18,69,132,.06);min-height:290px;overflow:hidden}
.economic .visual{background:linear-gradient(145deg,#fffefb,#fff8e9);border-color:rgba(190,125,20,.15)}
.environment .visual{background:linear-gradient(145deg,#fff,#f2faf4);border-color:rgba(45,135,79,.14)}
.visual h3{margin:0 0 4px;font-size:22px}.sub{font-size:12.2px;color:#61769b;margin-bottom:12px}
.pyramid{display:grid;gap:4px;max-width:1100px;margin:0 auto}.phead,.prow{display:grid;grid-template-columns:1fr 62px 1fr;gap:7px;align-items:center}
.phead{font-size:11px;font-weight:900;color:#4f6d96}.phead div:first-child{text-align:right}
.side{height:13px;display:flex}.side.m{justify-content:flex-end}.pbar{height:100%;border-radius:4px}
.side.m .pbar{background:linear-gradient(90deg,#59bff0,#0b68d9)}.side.f .pbar{background:linear-gradient(90deg,#80d9fa,#268edb)}
.age{text-align:center;font-size:10px;font-weight:800;color:#395a82}.pnote{text-align:center;margin-top:10px;font-size:11.5px;color:#557196}
.linewrap{height:225px}.linewrap svg{width:100%;height:100%;display:block}
.barset{display:grid;gap:25px;margin:38px 0 10px}.brow{display:grid;grid-template-columns:110px 1fr 100px;gap:12px;align-items:center}.blabel{font-weight:900;font-size:13px;color:#3f5a7d}.track{height:30px;border-radius:999px;background:#f2e5ca;overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#d88916,#f3bd51)}.bvalue{text-align:right;font-weight:900;font-size:14px}
.marine{display:grid;grid-template-columns:200px 1fr;gap:25px;align-items:center;min-height:220px}
.ring{width:180px;height:180px;border-radius:50%;margin:auto;position:relative;background:conic-gradient(#278653 0 80%,#dbeee2 80% 100%);box-shadow:0 12px 25px rgba(39,134,83,.17)}
.ring:after{content:"";position:absolute;inset:35px;background:#fff;border-radius:50%}.rtext{position:absolute;inset:0;z-index:2;display:grid;place-content:center;text-align:center;font-size:34px;font-weight:900;color:#217348}.rtext span{display:block;font-size:10px;color:#000;letter-spacing:.05em;text-transform:uppercase}
.mcopy strong{display:block;font-size:24px;color:#1d5839;margin-bottom:7px}.mcopy{font-size:14px;line-height:1.52;color:#395978}
.climate{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.metric{border-radius:17px;padding:22px;text-align:center;background:rgba(255,255,255,.76);border:1px solid rgba(39,134,83,.13)}.metric .big{font-size:44px;font-weight:900;color:#237a4a;line-height:1}.metric .cap{font-size:12px;font-weight:800;color:#4d6d5b;margin-top:9px;line-height:1.35}.metric.target .big{color:#3b9f66}.targettag{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#dff3e6;color:#27764a}
.footer{display:flex;justify-content:space-between;gap:18px;margin-top:16px;padding:14px 8px 2px;border-top:1px solid rgba(47,109,180,.12);font-size:12px;color:#526884}
@media(max-width:900px){.visual-grid{grid-template-columns:1fr}.strap{display:none}}
@media(max-width:650px){.cards{grid-template-columns:1fr}.marine{grid-template-columns:1fr}.climate{grid-template-columns:1fr}.hero h1{font-size:34px}.brow{grid-template-columns:1fr}.bvalue{text-align:left}}

/* Keep headline cards on one row on desktop */
.social .cards{grid-template-columns:repeat(5,minmax(0,1fr)) !important;}
.economic .cards{grid-template-columns:repeat(5,minmax(0,1fr)) !important;}
.environment .cards{grid-template-columns:repeat(4,minmax(0,1fr)) !important;}
.card{min-width:0;}
.card > div:last-child{min-width:0;}
.source,.period,.label{overflow-wrap:anywhere;word-break:normal;}
@media(max-width:1100px){
  .social .cards,.economic .cards{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
  .environment .cards{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
}
@media(max-width:650px){
  .social .cards,.economic .cards,.environment .cards{grid-template-columns:1fr !important;}
}

</style>
</head>
<body>
<div id="app">Loading…</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function ico(l){
 l=l.toLowerCase();
 if(l.includes("population")) return "👥";
 if(l.includes("college")) return "🎓";
 if(l.includes("mortality")) return "♥";
 if(l.includes("income")) return "⇄";
 if(l.includes("labour")) return "⚙";
 if(l.includes("gdp")) return "↗";
 if(l.includes("visitor")) return "✈";
 if(l.includes("inflation")) return "%";
 if(l.includes("trade")) return "▣";
 if(l.includes("marine")) return "◉";
 if(l.includes("ghg")) return "◌";
 if(l.includes("renewable")) return "☀";
 if(l.includes("sea-level")) return "≈";
 return "•";
}
function cards(xs){
 return `<div class="cards">${xs.map(x=>`<div class="card"><div class="icon">${ico(x.label)}</div><div><div class="label">${esc(x.label)}</div><div class="value">${esc(x.value)}</div><div class="period">${esc(x.period)}</div><div class="source">Source: <a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">${esc(x.source)}</a></div></div></div>`).join("")}</div>`;
}
function section(cls,title,small,strap,inner){
 const badge=cls==="social"?"👥":cls==="economic"?"↗":"❧";
 return `<section class="pillar ${cls}"><div class="head"><div class="badge">${badge}</div><h2>${title}</h2><small>${small}</small><div class="strap">${strap}</div></div>${inner}</section>`;
}
function pyramid(p){
 const max=Math.max(...p.series.flatMap(x=>[x.male,x.female]));
 return `<div class="visual-band"><div class="visual-kicker">Visual story</div><div class="visual-grid single"><div class="visual"><h3>${esc(p.title)}</h3><div class="sub">${esc(p.subtitle)} · Source: <a href="${esc(p.sourceUrl)}" target="_blank">${esc(p.source)}</a></div><div class="pyramid"><div class="phead"><div>Male</div><div>Age</div><div>Female</div></div>${p.series.map(x=>`<div class="prow"><div class="side m"><div class="pbar" style="width:${(x.male/max*100).toFixed(1)}%" title="${x.male} males"></div></div><div class="age">${esc(x.age)}</div><div class="side f"><div class="pbar" style="width:${(x.female/max*100).toFixed(1)}%" title="${x.female} females"></div></div></div>`).join("")}</div><div class="pnote">${esc(p.note)}</div></div></div></div>`;
}
function visitor(v){
 const w=820,h=230,l=44,r=22,t=25,b=34,max=Math.max(...v.series.map(x=>x.value));
 const X=i=>l+i*((w-l-r)/(v.series.length-1)),Y=n=>t+(h-t-b)*(1-n/max);
 return `<div class="visual"><h3>${esc(v.title)}</h3><div class="sub">${esc(v.subtitle)} · Source: <a href="${esc(v.sourceUrl)}" target="_blank">${esc(v.source)}</a></div><div class="linewrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${[0,.25,.5,.75,1].map(fr=>`<line x1="${l}" y1="${t+(h-t-b)*fr}" x2="${w-r}" y2="${t+(h-t-b)*fr}" stroke="#eadfc9"/>`).join("")}<polyline fill="none" stroke="#d88916" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${v.series.map((x,i)=>`${X(i)},${Y(x.value)}`).join(" ")}"/>${v.series.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.value)}" r="5" fill="#d88916"/><text x="${X(i)}" y="${Math.max(14,Y(x.value)-10)}" text-anchor="middle" font-size="10" font-weight="800" fill="#a9650b">${x.value.toLocaleString()}</text><text x="${X(i)}" y="${h-9}" text-anchor="middle" font-size="10" fill="#61769b">${x.label}</text>`).join("")}</svg></div></div>`;
}
function trade(t){
 const max=Math.max(...t.series.map(x=>x.value));
 return `<div class="visual"><h3>${esc(t.title)}</h3><div class="sub">${esc(t.subtitle)} · Source: <a href="${esc(t.sourceUrl)}" target="_blank">${esc(t.source)}</a></div><div class="barset">${t.series.map(x=>`<div class="brow"><div class="blabel">${esc(x.label)}</div><div class="track"><div class="fill" style="width:${(x.value/max*100).toFixed(1)}%"></div></div><div class="bvalue">${esc(x.display)}</div></div>`).join("")}</div></div>`;
}
function marine(m){
 return `<div class="visual"><h3>${esc(m.title)}</h3><div class="sub">${esc(m.subtitle)} · Source: <a href="${esc(m.sourceUrl)}" target="_blank">${esc(m.source)}</a></div><div class="marine"><div class="ring"><div class="rtext">80%<span>of EEZ protected</span></div></div><div class="mcopy"><strong>Four-fifths protected</strong>The Palau National Marine Sanctuary covers 80% of Palau’s Exclusive Economic Zone — a defining part of the country’s environmental leadership.</div></div></div>`;
}
function climate(c){
 return `<div class="visual"><h3>${esc(c.title)}</h3><div class="sub">${esc(c.subtitle)} · Source: <a href="${esc(c.sourceUrl)}" target="_blank">${esc(c.source)}</a></div><div class="climate"><div class="metric"><div class="big">${c.emissionsShare}%</div><div class="cap">of total national GHG emissions came from electricity generation in 2022</div></div><div class="metric target"><div class="big">${c.renewableTarget}%</div><div class="cap">renewable share of electricity generation targeted for 2030</div><div class="targettag">2030 TARGET</div></div></div></div>`;
}
async function main(){
 const d={"meta": {"title": "Palau — Key Statistics", "subtitle": "", "lastUpdated": "13 September 2026"}, "social": {"cards": [{"label": "Population", "value": "17,614", "period": "2020 Census", "source": "Palau Office of Planning and Statistics — 2020 Census", "sourceUrl": "https://www.palaugov.pw/executive-branch/ministries/finance/budgetandplanning/population-census/"}, {"label": "College attainment", "value": "15.3%", "period": "Adults 25+ with 4+ years of college · 2020", "source": "Palau Office of Planning and Statistics — 2023 Statistical Yearbook", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/2023-Statistical_Yearbook.pdf"}, {"label": "Infant mortality", "value": "16.4 / 1,000", "period": "Live births · 2023", "source": "Palau Office of Planning and Statistics — 2023 Statistical Yearbook", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/2023-Statistical_Yearbook.pdf"}, {"label": "Top 20% income share", "value": "42%", "period": "Bottom 20% receive ~9% · 2023/24", "source": "Palau Office of Planning and Statistics / SPC — 2023/24 HIES", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/2023-2024-Household-Income-Expenditure-Survey-Report.pdf"}, {"label": "Labour-force participation", "value": "76.9%", "period": "Population aged 16+ · 2020", "source": "Palau Office of Planning and Statistics — 2020 Census", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/2022/09/2020-Census-of-Population-and-Housing.pdf"}], "pyramid": {"title": "Population pyramid", "subtitle": "Population by age and sex · 2020 Census", "source": "Palau Office of Planning and Statistics — 2020 Census", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/2023-Statistical_Yearbook.pdf", "note": "Median age: 37.4 years for males and 38.7 years for females.", "series": [{"age": "75+", "male": 174, "female": 302}, {"age": "70–74", "male": 207, "female": 231}, {"age": "65–69", "male": 375, "female": 382}, {"age": "60–64", "male": 542, "female": 498}, {"age": "55–59", "male": 669, "female": 596}, {"age": "50–54", "male": 704, "female": 673}, {"age": "45–49", "male": 818, "female": 627}, {"age": "40–44", "male": 827, "female": 605}, {"age": "35–39", "male": 818, "female": 551}, {"age": "30–34", "male": 794, "female": 566}, {"age": "25–29", "male": 796, "female": 540}, {"age": "20–24", "male": 478, "female": 419}, {"age": "15–19", "male": 536, "female": 507}, {"age": "10–14", "male": 605, "female": 597}, {"age": "5–9", "male": 624, "female": 540}, {"age": "0–4", "male": 527, "female": 486}]}}, "economic": {"cards": [{"label": "GDP growth", "value": "6.0%", "period": "FY2025 · preliminary", "source": "Palau Office of Planning and Statistics — GDP FY2025", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/Gross-Domestic-Product-P_Preliminary-FY2025.pdf"}, {"label": "GDP", "value": "US$351.7m", "period": "Current prices · FY2025 preliminary", "source": "Palau Office of Planning and Statistics — GDP FY2025", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/Gross-Domestic-Product-P_Preliminary-FY2025.pdf"}, {"label": "Visitor arrivals", "value": "65,558", "period": "FY2025", "source": "Palau Government — Immigration & Tourism Statistics", "sourceUrl": "https://www.palaugov.pw/executive-branch/ministries/finance/budgetandplanning/immigration-tourism-statistics/"}, {"label": "Annual inflation", "value": "0.1%", "period": "Q4 2025 · year-on-year", "source": "Palau Office of Planning and Statistics — CPI Q4 2025", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/Palau-CPI-Publication-Q4-2025.pdf"}, {"label": "Trade deficit", "value": "US$198.4m", "period": "Merchandise trade · CY2025", "source": "Palau Office of Planning and Statistics — IMTS Q4 2025", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/IMTS-Release-2025_Q4.pdf"}], "visitors": {"title": "Tourism", "subtitle": "Visitor arrivals · FY2019–FY2025", "source": "Palau Government — Immigration & Tourism Statistics", "sourceUrl": "https://www.palaugov.pw/executive-branch/ministries/finance/budgetandplanning/immigration-tourism-statistics/", "series": [{"label": "2019", "value": 89379}, {"label": "2020", "value": 41628}, {"label": "2021", "value": 3400}, {"label": "2022", "value": 9247}, {"label": "2023", "value": 35052}, {"label": "2024", "value": 52661}, {"label": "2025", "value": 65558}]}, "trade": {"title": "Trade", "subtitle": "Merchandise trade · CY2025", "source": "Palau Office of Planning and Statistics — IMTS Q4 2025", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/IMTS-Release-2025_Q4.pdf", "series": [{"label": "Imports", "value": 211.5, "display": "US$211.5m"}, {"label": "Exports", "value": 13.1, "display": "US$13.1m"}]}}, "environment": {"cards": [{"label": "Marine sanctuary", "value": "80% of EEZ", "period": "Palau National Marine Sanctuary", "source": "Ministry of Agriculture, Fisheries and the Environment — 2024 Transition Report", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/MAFE-2024-Transition-Report.pdf"}, {"label": "Electricity share of GHG emissions", "value": "59%", "period": "2022 national GHG inventory", "source": "Palau Enhanced NDC 2025–2030", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/DRAFT__Palau-Enhanced-NDC-2025-2030-SPC_NDCHUB_etc.pdf"}, {"label": "Renewable electricity target", "value": "70%", "period": "Target for 2030", "source": "Palau Enhanced NDC 2025–2030", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/DRAFT__Palau-Enhanced-NDC-2025-2030-SPC_NDCHUB_etc.pdf"}, {"label": "Projected sea-level rise", "value": "3.0–6.3 in", "period": "By 2030 · projection", "source": "Palau Water Policy 2025–2045", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/Palau-Water-Policy-2025-2045.pdf"}], "marine": {"title": "Palau protects four-fifths of its EEZ", "subtitle": "Palau National Marine Sanctuary", "source": "Ministry of Agriculture, Fisheries and the Environment — 2024 Transition Report", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/MAFE-2024-Transition-Report.pdf", "protected": 80, "other": 20}, "climate": {"title": "Energy is central to Palau’s climate challenge", "subtitle": "2022 GHG inventory and 2030 renewable-electricity target", "source": "Palau Enhanced NDC 2025–2030", "sourceUrl": "https://www.palaugov.pw/wp-content/uploads/DRAFT__Palau-Enhanced-NDC-2025-2030-SPC_NDCHUB_etc.pdf", "emissionsShare": 59, "renewableTarget": 70}}};
 const social=cards(d.social.cards)+pyramid(d.social.pyramid);
 const econ=cards(d.economic.cards)+`<div class="visual-band"><div class="visual-kicker">Visual story</div><div class="visual-grid">${visitor(d.economic.visitors)}${trade(d.economic.trade)}</div></div>`;
 const env=cards(d.environment.cards)+`<div class="visual-band"><div class="visual-kicker">Visual story</div><div class="visual-grid">${marine(d.environment.marine)}${climate(d.environment.climate)}</div></div>`;
 document.getElementById("app").innerHTML=`<main class="wrap"><div class="hero"><h1>${esc(d.meta.title)}</h1>${d.meta.subtitle ? `<p>${esc(d.meta.subtitle)}</p>` : ""}</div>${section("social","SOCIAL","People","",social)}${section("economic","ECONOMIC","Economy","",econ)}${section("environment","ENVIRONMENT","Environment","",env)}<div class="footer"><div>Every indicator links to its official source.</div><div><strong>Updated:</strong> ${esc(d.meta.lastUpdated)}</div></div></main>`;
}
main().catch(e=>document.getElementById("app").innerHTML=`<div style="padding:25px">Could not render dashboard: ${esc(e.message)}</div>`);
</script>
</body></html>
