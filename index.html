<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palau — Key Statistics</title>
<style>
:root{
  --navy:#07195b;--blue:#0a67db;--blue2:#22a5f5;--ink:#0b1f63;--muted:#60739a;
  --line:#cfe2f4;--shadow:0 10px 28px rgba(20,66,137,.10);
  --gold:#d88916;--gold2:#f2b84b;--green:#2b8654;--green2:#70c58b;
}
*{box-sizing:border-box} html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 0%,rgba(64,170,255,.11),transparent 28%),linear-gradient(180deg,#fff 0%,#f5fbff 60%,#eef8ff 100%)}
.wrap{width:100%;padding:14px 14px 26px}
.hero-main,.pillar{border:1px solid rgba(54,116,187,.16);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.hero-main{position:relative;min-height:170px;padding:24px 28px;margin-bottom:18px;background:linear-gradient(115deg,#fff 0%,#fcfeff 50%,#ddf3ff 100%)}
.hero-main:before{content:"";position:absolute;width:450px;height:450px;right:-170px;top:-220px;border-radius:50%;background:radial-gradient(circle at 40% 60%,rgba(32,155,244,.38),rgba(90,199,255,.16) 38%,rgba(255,255,255,0) 66%)}
.hero-main h1{margin:4px 0 12px;font-size:44px;line-height:1.02;letter-spacing:-.8px;color:var(--navy);position:relative}
.hero-main p{margin:0;max-width:880px;font-size:15px;line-height:1.52;color:#35557f;position:relative}
.pillar{margin:18px 0;background:#fff}
.social{background:linear-gradient(180deg,#f8fcff 0%,#edf7ff 100%)}
.economic{background:linear-gradient(180deg,#fffdf7 0%,#fff6df 100%)}
.environment{background:linear-gradient(180deg,#f7fcf8 0%,#eaf7ed 100%)}
.pillar-head{display:flex;align-items:center;gap:13px;min-height:70px;padding:10px 16px;color:#fff;position:relative}
.social .pillar-head{background:linear-gradient(90deg,#0b63d7,#1b9cf0 52%,#59c5f6)}
.economic .pillar-head{background:linear-gradient(90deg,#b56a08,#e09118 55%,#f2b84b)}
.environment .pillar-head{background:linear-gradient(90deg,#237a4b,#319b62 55%,#6fc58a)}
.badge{width:52px;height:52px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:24px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.42)}
.pillar h2{margin:0;font-size:28px;letter-spacing:-.3px}.tag{font-size:12.5px}.strap{margin-left:auto;max-width:45%;text-align:right;font-size:12.5px;font-weight:700}
.cards{display:grid;gap:11px;padding:13px}
.card{min-height:154px;position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start;padding:14px 13px;border-radius:17px;border:1px solid rgba(45,108,181,.13);background:linear-gradient(145deg,#fff,#f7fbff);box-shadow:0 7px 17px rgba(18,69,132,.07)}
.economic .card{background:linear-gradient(145deg,#fffefb,#fff8e9);border-color:rgba(190,125,20,.16)}
.environment .card{background:linear-gradient(145deg,#fff,#f3faf5);border-color:rgba(45,135,79,.14)}
.icon{width:46px;height:46px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:15px;font-size:21px;background:#e5f2ff;color:#0a65cf}
.economic .icon{background:#ffedc8;color:#b46b0b}.environment .icon{background:#dff3e5;color:#2b8654}
.card-body{min-width:0}.label{font-size:12.4px;font-weight:800;line-height:1.23;color:#0c2460;margin-bottom:7px}
.value{font-size:clamp(20px,1.7vw,28px);line-height:1.04;font-weight:900;color:#071a59;letter-spacing:-.4px;white-space:nowrap}
.period{font-size:11.3px;line-height:1.32;color:#61769c;margin-top:7px}.card-source{font-size:9.8px;line-height:1.28;color:#3d5d88;margin-top:8px}
.card-source a,.visual-source-link{color:#456fa6;text-decoration:underline;text-underline-offset:2px}
.visuals{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:0 13px 14px}
.visual{position:relative;overflow:hidden;border-radius:17px;border:1px solid rgba(45,110,181,.13);background:linear-gradient(145deg,#fff,#f6fbff);box-shadow:0 7px 17px rgba(18,69,132,.06);padding:15px 17px;min-height:250px}
.economic .visual{background:linear-gradient(145deg,#fffefb,#fff8e9);border-color:rgba(190,125,20,.15)}
.environment .visual{background:linear-gradient(145deg,#fff,#f2faf4);border-color:rgba(45,135,79,.14)}
.visual h3{margin:0 0 4px;font-size:20px;color:#0b1e5b}.visual-sub{font-size:12.4px;color:#61769b;margin-bottom:12px}
.line-wrap{height:220px}.line-svg{width:100%;height:100%;display:block}
.trade-bars,.energy-bars{display:grid;gap:22px;margin-top:32px}
.trade-row,.energy-row{display:grid;grid-template-columns:130px 1fr 90px;gap:12px;align-items:center}
.bar-label{font-weight:800;font-size:13px;color:#314e77}.bar-track{height:28px;border-radius:999px;background:#f3e4c6;overflow:hidden}
.trade-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#d88916,#f2b84b)}
.energy-bars .bar-track{background:#e1eee5}.energy-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#2b8654,#70c58b)}
.bar-value{text-align:right;font-weight:900;color:#0b1e5b;font-size:14px}
.pyramid{display:grid;gap:5px;margin-top:8px}.pyr-head,.pyr-row{display:grid;grid-template-columns:1fr 54px 1fr;gap:7px;align-items:center}
.pyr-head{font-size:11px;font-weight:800;color:#567095}.pyr-head div:first-child{text-align:right}.pyr-head div:last-child{text-align:left}
.pyr-side{height:12px;display:flex;align-items:center}.pyr-side.male{justify-content:flex-end}.pyr-bar{height:100%;border-radius:4px}
.pyr-side.male .pyr-bar{background:linear-gradient(90deg,#4cb8f4,#0b67d7)}.pyr-side.female .pyr-bar{background:linear-gradient(90deg,#73d7ff,#248ee2)}
.pyr-age{text-align:center;font-size:10px;font-weight:800;color:#34577e}.pyr-foot{margin-top:9px;font-size:11px;color:#60739a;text-align:center}
.marine-wrap{display:grid;grid-template-columns:190px 1fr;gap:24px;align-items:center;min-height:205px}
.marine-ring{width:170px;height:170px;border-radius:50%;background:conic-gradient(#2b8654 0 80%,#dcefe3 80% 100%);position:relative;margin:auto;box-shadow:0 10px 24px rgba(43,134,84,.16)}
.marine-ring:after{content:"";position:absolute;inset:34px;background:#fff;border-radius:50%}.marine-center{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;font-size:30px;color:#237a4b}.marine-center span{font-size:11px;font-weight:800;color:#60739a}
.marine-copy{font-size:14px;line-height:1.5;color:#36577f}.marine-copy strong{display:block;font-size:22px;color:#174f34;margin-bottom:8px}
.sources{margin-top:18px;padding:16px 9px 3px;display:flex;justify-content:space-between;gap:20px;border-top:1px solid rgba(47,109,180,.12);color:#526884;font-size:12.2px;line-height:1.42}
@media(max-width:900px){.visuals{grid-template-columns:1fr}.strap{display:none}}
@media(max-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))!important}.hero-main h1{font-size:34px}.marine-wrap{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:10px 8px 22px}.cards{grid-template-columns:1fr!important}.sources{flex-direction:column}.trade-row,.energy-row{grid-template-columns:1fr}.bar-value{text-align:left}}
</style>
</head>
<body>
<div id="app">Loading…</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function icon(label,section){
 const l=label.toLowerCase();
 if(l.includes("population")) return "👥";
 if(l.includes("college")) return "🎓";
 if(l.includes("mortality")) return "♥";
 if(l.includes("income")) return "⇄";
 if(l.includes("labour")) return "⚙";
 if(l.includes("gdp")) return "↗";
 if(l.includes("visitor")) return "✈";
 if(l.includes("inflation")) return "%";
 if(l.includes("trade")) return "▣";
 if(l.includes("marine")) return "◉";
 if(l.includes("electricity access")) return "⚡";
 if(l.includes("emissions")) return "◌";
 if(l.includes("sea-level")) return "≈";
 return "•";
}
function cards(items,section){
 const cols=items.length;
 return `<div class="cards" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${items.map(x=>`
 <div class="card"><div class="icon">${icon(x.label,section)}</div><div class="card-body">
 <div class="label">${esc(x.label)}</div><div class="value">${esc(x.value)}</div><div class="period">${esc(x.period)}</div>
 <div class="card-source">Source: <a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">${esc(x.source)}</a></div>
 </div></div>`).join("")}</div>`;
}
function section(cls,title,tag,strap,content){
 const badge=cls==="social"?"👥":cls==="economic"?"↗":"❧";
 return `<section class="pillar ${cls}"><div class="pillar-head"><div class="badge">${badge}</div><h2>${title}</h2><div class="tag">${tag}</div><div class="strap">${strap}</div></div>${content}</section>`;
}
function pyramid(p){
 const max=Math.max(...p.series.flatMap(x=>[x.male,x.female]));
 const rows=p.series.map(x=>`<div class="pyr-row">
 <div class="pyr-side male"><div class="pyr-bar" style="width:${(x.male/max*100).toFixed(1)}%" title="${x.male.toLocaleString()} males"></div></div>
 <div class="pyr-age">${esc(x.age)}</div>
 <div class="pyr-side female"><div class="pyr-bar" style="width:${(x.female/max*100).toFixed(1)}%" title="${x.female.toLocaleString()} females"></div></div>
 </div>`).join("");
 return `<div class="visuals" style="grid-template-columns:1fr"><div class="visual">
 <h3>${esc(p.title)}</h3><div class="visual-sub">${esc(p.subtitle)} · Source: <a class="visual-source-link" href="${esc(p.sourceUrl)}" target="_blank">${esc(p.source)}</a></div>
 <div class="pyramid"><div class="pyr-head"><div>Male</div><div>Age</div><div>Female</div></div>${rows}</div>
 <div class="pyr-foot">${esc(p.median)}</div></div></div>`;
}
function visitorLine(v){
 const w=820,h=220,left=42,right=24,top=22,bottom=35,max=Math.max(...v.series.map(x=>x.value));
 const x=i=>left+i*((w-left-right)/(v.series.length-1));
 const y=n=>top+(h-top-bottom)*(1-n/max);
 const pts=v.series.map((d,i)=>({x:x(i),y:y(d.value),...d}));
 return `<div class="visual"><h3>${esc(v.title)}</h3><div class="visual-sub">${esc(v.subtitle)} · Source: <a class="visual-source-link" href="${esc(v.sourceUrl)}" target="_blank">${esc(v.source)}</a></div>
 <div class="line-wrap"><svg class="line-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
 ${[0,.25,.5,.75,1].map(fr=>`<line x1="${left}" y1="${top+(h-top-bottom)*fr}" x2="${w-right}" y2="${top+(h-top-bottom)*fr}" stroke="#eadfc9" stroke-width="1"/>`).join("")}
 <polyline points="${pts.map(p=>`${p.x},${p.y}`).join(" ")}" fill="none" stroke="#d88916" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#d88916"/><text x="${p.x}" y="${Math.max(14,p.y-10)}" text-anchor="middle" font-size="10" font-weight="800" fill="#a95e08">${p.value.toLocaleString()}</text><text x="${p.x}" y="${h-10}" text-anchor="middle" font-size="10" fill="#61769b">${p.label}</text>`).join("")}
 </svg></div></div>`;
}
function barsChart(obj,kind){
 const max=Math.max(...obj.series.map(x=>x.value));
 const cls=kind==="energy"?"energy":"trade";
 return `<div class="visual"><h3>${esc(obj.title)}</h3><div class="visual-sub">${esc(obj.subtitle)} · Source: <a class="visual-source-link" href="${esc(obj.sourceUrl)}" target="_blank">${esc(obj.source)}</a></div>
 <div class="${cls}-bars">${obj.series.map(x=>`<div class="${cls}-row"><div class="bar-label">${esc(x.label)}</div><div class="bar-track"><div class="${cls}-fill" style="width:${(x.value/max*100).toFixed(1)}%"></div></div><div class="bar-value">${esc(x.display)}</div></div>`).join("")}</div></div>`;
}
function marine(m){
 return `<div class="visual"><h3>${esc(m.title)}</h3><div class="visual-sub">${esc(m.subtitle)} · Source: <a class="visual-source-link" href="${esc(m.sourceUrl)}" target="_blank">${esc(m.source)}</a></div>
 <div class="marine-wrap"><div class="marine-ring"><div class="marine-center">80%<span>protected EEZ</span></div></div>
 <div class="marine-copy"><strong>80% protected</strong>Palau’s National Marine Sanctuary covers four-fifths of the country’s Exclusive Economic Zone. The remaining 20% is outside the sanctuary, including the domestic fishing zone.</div></div></div>`;
}
async function load(){
 const r=await fetch("data.json",{cache:"no-store"}); const d=await r.json();
 const social=cards(d.social.cards,"social")+pyramid(d.social.pyramid);
 const economic=cards(d.economic.cards,"economic")+`<div class="visuals">${visitorLine(d.economic.visitors)}${barsChart(d.economic.trade,"trade")}</div>`;
 const environment=cards(d.environment.cards,"environment")+`<div class="visuals">${marine(d.environment.marine)}${barsChart(d.environment.energy,"energy")}</div>`;
 document.getElementById("app").innerHTML=`<main class="wrap">
 <section class="hero-main"><h1>${esc(d.meta.title)}</h1><p>${esc(d.meta.subtitle)}</p></section>
 ${section("social","SOCIAL","People","Scale, human capital, health, inequality and workforce participation.",social)}
 ${section("economic","ECONOMIC","Economy","Recovery, tourism exposure, prices and external dependence.",economic)}
 ${section("environment","ENVIRONMENT / RESILIENCE","Resilience","Marine leadership, energy security and climate exposure.",environment)}
 <div class="sources"><div><strong>Official sources:</strong> ${d.sources.map(esc).join(" · ")}</div><div><strong>Updated:</strong> ${esc(d.meta.lastUpdated)}</div></div>
 </main>`;
}
load().catch(e=>document.getElementById("app").innerHTML=`<div style="padding:24px">Could not load data.json: ${esc(e.message)}</div>`);
</script>
</body>
</html>
